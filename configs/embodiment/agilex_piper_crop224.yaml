# agilex_piper_crop at 224 x 224, for the frozen DINOv2's 14 px patches 16 x 16 per camera instead of
# 9 x 9. Everything else (the operator mask, the table outline) is agilex_piper_crop's.
#
# AgileX Piper, one 6-DoF arm with a parallel gripper, teleoperated from a leader arm
# (Stage B robot, thesis plan F1). Demos are LeRobot v3.0 recordings at 15 fps in
# ~/piper_datasets, read by flowcl/data/piper_adapter.py.
name: agilex_piper_crop224

observation:
  # Order is load-bearing (token order into the trunk). front = the recordings'
  # observation.images.image (third person), wrist = observation.images.wrist_image.
  cameras:
    - front
    - wrist
  # Recorded at 640x480 and reduced by flowcl.data.images.policy_frame for both the
  # training cache and serving.
  image_size: [224, 224]
  # Measured joint positions (rad) and the measured gripper opening (m, 0 = closed).
  # Both are what the robot reports live; the gripper reads the object's width while
  # holding it.
  d_state: 7
  state_keys:
    - [joints, 6]
    - [gripper, 1]
  # The front camera sees the operator and the leader arm (top left). The leader arm's
  # pose is the action, and it sits still at home when the policy runs alone, so that
  # corner is blacked out in training and serving alike. Vertices are (x, y) pixels of
  # the recorded 640x480 frame, checked against frames from every episode. Widened on
  # 2 Nov 2026 for the pick_sausage_v4 session, where the scene sits lower in the frame
  # and the leader arm and the operator's hands reach past the first polygon,
  # [[0,0],[260,0],[260,115],[150,250],[0,260]] (every checkpoint carries its own).
  mask_source_hw: [480, 640]
  image_masks:
    front:
      - [[0, 0], [290, 0], [290, 180], [255, 300], [0, 310]]
  # The working area the user drew on 3 Nov over the grape session's front view: the
  # table's near surface, up to its far edge. Outside it (the PC, the monitor, the
  # jacket's table, the floor) is black, and the policy image is cut to its bounding
  # box (x 144-593, y 195-480), about 1.4x wider and 1.7x taller than the full frame.
  image_crops:
    front: [[146, 275], [233, 272], [234, 220], [243, 200], [258, 195], [278, 196],
            [323, 205], [368, 227], [418, 247], [468, 277], [513, 302], [538, 327],
            [563, 345], [593, 365], [573, 427], [553, 480], [148, 480], [157, 432],
            [153, 397], [144, 297]]

action:
  # Absolute joint targets (rad) + gripper target (m) from the leader arm. The
  # measured state follows them 1-2 ticks later.
  d_action: 7
  control_mode: joint_position
  # The recording rate; no subsampling.
  control_rate_hz: 15.0
  # 1.07 s of future actions.
  chunk_horizon: 16
  # 0.53 s open-loop, then replan.
  execute_k: 8
  already_normalized: false
  component_keys:
    - [joints, 6]
    - [gripper, 1]

notes: >
  AgileX Piper single arm, leader-follower teleop recorded with LeRobot (robot_type
  piper) at 15 fps. The recordings also carry observation.eef / action.eef (end-effector
  pose and deltas); they are not used. No std floor yet: a floor matters only for later
  tasks under frozen Task-1 stats, and it would have to spare the gripper (std 0.018 m).
