# gpm_neg: plain GPM (configs/method/gpm.yaml, gpm_projected_adam) with instruction negatives at
# stage 0 (flowcl/methods/instruction_negatives.py; rule configs/analysis/instruction_negatives.yaml).
# Every GPM key is gpm.yaml's. Display name gpm_projected_adam_neg; registry name gpm_neg.
name: gpm_neg

eps: 0.95
projection: gradient_and_update
residual_rtol: 1.0e-3
residual_weight_atol: 1.0e-6
log_interval: 100
update_memory: true
capture_config: subspace

negative_bank: instruction_negatives_bank
negative_weight: 1.0
negative_stages: [0]
negative_log_interval: 100
