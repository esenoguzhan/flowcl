# ewc: online EWC (spec §6 item 4; docs/thesis_plan.md, Workstream B). See flowcl/methods/ewc.py.
#
# The production estimator is the sampled Fisher of a unit-variance Gaussian velocity model, each
# task's Fisher normalized to mean 1 before the online sum (Kirkpatrick et al. 2017; Schwarz et al.
# 2018), as bracketed in configs/analysis/baseline_selection_ewc_v2.yaml.
#
# lam is UNSET on purpose: it is filled from that bracket's frozen selection bundle
# (results/baseline_selection_v2/ewc/selection/), in a commit of its own, before any 4-task EWC run.
# A run with lam: null refuses to start.
name: ewc

lam: null
fisher_samples: 1024
log_interval: 100
fisher_estimator: sampled
fisher_normalization: mean
