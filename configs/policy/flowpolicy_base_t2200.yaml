# flowpolicy_base with room for 448 x 448 inputs: two cameras of 1025 tokens each, plus state,
# language and context queries, come to about 2115. Only the position table grows.
# Reference FlowPolicy (spec §4.2 upper end): d_model 512, 8 trunk layers.
# §8.2 requires the trainable parameter count to land in 20-60M; this config is the
# one the headline results use.
name: flowpolicy_base_t2200

vision_backbone: dinov2_s
text_backbone: clip_b
pretrained: true

d_model: 512
n_trunk_layers: 8
n_heads: 8
mlp_ratio: 4.0
n_context_tokens: 32
max_tokens: 2200

# 4, not 6: each decoder block at d_model=512 costs ~6.6M trainable parameters, of
# which ~2.4M is the AdaLN modulation projection. Six blocks put the model at 66.9M,
# above the 20-60M band §8.2 asks for; four lands at ~53.8M.
n_decoder_layers: 4

s_sampler:
  name: uniform

euler_steps: 10
