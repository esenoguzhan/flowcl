# Two-task A -> B curriculum for the similar-vs-diverse continual study
# (configs/analysis/similar_cl.yaml). T1 is task A of the similar-task diagnostic
# (docs/runs/2026-10-04_similar_tasks.md); T2 is diverse (another suite, scene, object and goal).
name: similar_ab_milk

description: >
  A (put the bowl on the plate) then B (libero_object/pick_up_the_milk_and_place_it_in_the_basket). B is diverse (another suite, scene, object and goal).

expectation: >
  Exploratory. Hard projection removes more of a similar B's gradient energy than a diverse
  B's at A's checkpoint, so GPM's plasticity cost (against allowlist fine-tuning) is predicted
  to be larger on a similar B.

tasks:
  - task_key: libero_goal/put_the_bowl_on_the_plate
    n_demos: 50
  - task_key: libero_object/pick_up_the_milk_and_place_it_in_the_basket
    n_demos: 50
