# The allocation-rules pilot: does WHERE GPM protects matter at a fixed AMOUNT? Pre-registered rule,
# committed before the smoke and before any training (written Fri 20 Nov 2026).
#
# QUESTION. C1 (configs/analysis/high_protection.yaml) could not separate the amount of protection from
# its allocation: flat 0.99 (gpm_e99) reproduced adaptive GPM's Object gain at T2, and after that the two
# protected different amounts (seed 0 after T4: 64.5 % of the registry weights against 79.9 %). Here
# every arm protects exactly e99's amount after T2, T3 and T4 (same seed) and only the allocation rule
# differs. The comparator is the existing e99 run, the flat rule on the same schedule.
#
# ARMS (seed 0; 4-task seq_hetero; configs/method/gpm_alloc_<arm>.yaml; flowcl/analysis/allocation.py):
#   novelty  tau = max(0.95, min(1, p + f (1 - p)))                           (ne90's rule, f matched)
#   size     k = max(k(0.95), #{residual eigenvalues >= delta * tr K})        (delta matched; reversed)
#   room     novelty with f_l = min(0.99999, kappa (1 - rho_l)), rho_l = k_before / d_in   (kappa matched)
# Every k counts added directions; the 0.95 per-layer floor holds for the arm's own memory and inputs.
# T1 stays at eps = 0.95 in every arm, so stages 0-1 and the T1 memory are bitwise plain GPM's (and
# e99's). Targets are e99's integer protected counts sum_l d_out,l k_l (memory_task3.pt histories).
# Matching: the knob is bisected to the two attainable counts around the target; the nearest end is
# taken, an exact tie goes to the upper end; floor_bound / ceiling_bound take the endpoint and record
# the error. The allocation is the bracket end itself.
#
# PREDICTIONS (offline, below): the T2 Grams are identical in all arms, so ne90's T2 artifact gives every
# rule's post-T2 allocation exactly. The predictor first reproduces e99 (flat 0.99) and ne90 (novelty 0.9)
# on 91/91 layers for seeds 0, 1, 2. Capacity reallocated vs e99 after T2 (seed 0): novelty 1.19 pp,
# size 3.48 pp, room 14.79 pp (room moves protection from the trunk, 78.7 -> 57.2 %, to the decoder,
# 21.6 -> 53.8 %). Novelty is a narrow comparison: it clears the 1 pp gate by 0.19 pp.
# A prediction_borderline layer is a jump layer: its k differs between the two ends of the predicted
# bracket (equivalently, k changes under a +-1e-9 relative change of the reconstructed tr K). One per
# rule and seed (two in seed 1's room arm: k_proj and v_proj share their input).
#
# GATES (per arm; only the extensions that shape later training: post-T2 acts on T3, post-T3 on T4):
#   invalid_comparison      stages 0-1 or the T1 memory differ from plain GPM, T1 pairing failed, or the
#                           run config differs from e99's beyond the method block and neutral new keys
#   invalid_matching        post-T2 or post-T3 realised count off the target by more than 0.05 pp
#                           (a floor_bound or ceiling_bound endpoint included)
#   invalid_implementation  post-T2 per-layer k differs from the prediction on a layer other than the
#                           predicted jump layers (a +-1 difference there is the flag prediction_borderline)
#   not_distinct            capacity reallocated vs e99, R = 1/2 sum d_out |k_a - k_b| / sum d_out d_in,
#                           below 1 pp after both post-T2 and post-T3
#   invalid_evaluation      a rep-0 re-run differs from the stored cell (e99: all 4 tasks; arms: T4), the
#                           rollout seeds differ across arms in any task x repetition, a repetition
#                           repeats another's noise, or a checkpoint / eval provenance check fails
#   invalid_run             the strict sequence report's required checks fail, or artifacts are missing
# Post-T4 matching is not a pilot gate: it is required to continue an arm into E3 (T5 trains under it).
#
# PRIMARY (per valid, distinct arm): dACC = ACC(arm) - ACC(e99) after T4 (stage 3), over 4 tasks x 50
# initial states x 3 repetitions. Repetitions reuse LIBERO's 50 fixed states with fresh noise (rep 0 the
# runs' namespace, rep r the namespace + __rep<r>); a state with its 3 repetitions is one observation;
# the 95 % CI resamples states independently per task column, paired across arms (10 000 resamples,
# pointwise: an exploratory promotion screen, not simultaneous). It is evaluation uncertainty of these
# seed-0 checkpoints, not training-seed variation.
# LABELS: allocation_helps (CI low > 0), allocation_hurts (CI high < 0), unresolved.
# DESCRIPTIVE: dNBT, dAUC, per-task forgetting (rep 0, A5 rollout bootstrap), the T3-T4 diagonal, the
# per-step / probe loss, capacity per stage and half, R and the subspace overlap per extension.
#
# CONSEQUENCES. The pilot decides only which arms go to seeds 1-2, not the E3 selection.
#   * allocation_helps -> seeds 1-2 of that arm as the confirmatory test (seed 0 left out of the claim;
#     ~9.6 GPU-h training per arm plus evaluations). Each follow-up seed passes every gate above first
#     (an invalid seed: inconclusive_invalid); then CI low > 0 on both seeds = replicated_on_both_held_out_seeds,
#     on one = mixed, on none = not_replicated. E3 takes at most one new arm, the replicated arm with the
#     largest mean dACC over seeds 1-2; its T5-T8 schedule comes from E3's e99 arm, so it resumes after it.
#   * E3 resume rule (declared now, built only if an arm replicates): a resume must match the rule and
#     every target already used; future targets may be appended; a changed historical target is refused
#     (GPM.restore_memory and continual.py's method-kwargs equality both need the change).
#   * The sentence "the tested allocations showed no resolvable ACC difference from flat at matched
#     capacity (seed 0, exploratory)" is used only if all three arms are valid and distinct and all three
#     CIs include 0. Any other pattern is reported arm by arm. allocation_hurts is reported, no follow-up.
#
# Code: flowcl/experiments/allocation_rules.py (predict, check_arm, summary), flowcl/experiments/alloc_queue.py
# (preflight), scripts/queue_alloc.sh. Outputs: results/allocation_rules/seed<S>/.

seeds: [0, 1, 2]
pilot_seeds: [0]
arms: [novelty, size, room]
comparator: e99

gates:
  matching_tasks: [1, 2]
  e3_matching_task: 3
  matching_tol_pp: 0.05
  distinct_tasks: [1, 2]
  distinct_min_pp: 1.0
  borderline_max_abs: 1

evaluation:
  stage: 3
  n_episodes: 50
  repetitions: [0, 1, 2]
  # rep 0 re-run (the reproduction gate): task positions, or all.
  rep0_rerun: {e99: all, novelty: [3], size: [3], room: [3]}

bootstrap: {n_resamples: 10000, confidence: 0.95, seed: 0}

smoke: {n_episodes: 1}

