# Instruction negatives on the other two B tasks of the 5 Oct study (cabinet top, milk), seed 0:
# does the stove pilot's effect hold on the second similar task, and do the negatives cost anything
# where GPM already retained plate (the diverse task)? EXPLORATORY: one seed, one stage-A base
# (the stove pilot's), conventions fixed before any run (the scratch smoke included). Evaluated by
# scripts/instruction_negatives_curricula.py; queued by scripts/queue_instruction_negatives_curricula.sh.
#
# WHY: the stove pilot (docs/runs/2026-11-17_instruction_negatives.md; rule
# instruction_negatives.yaml, summary valid) found plate after stove 0.70 under GPM with negatives
# against 0.00 under historical GPM and 0.00 under allowlist_ft with the same negatives. One B task.
# Historically (docs/runs/2026-10-05_similar_cl.md) every arm lost plate after cabinet top (0.00),
# and GPM kept it after milk (0.92).
#
# DESIGN: four stage-1 runs RESUMED from the stove pilot's stage-A checkpoints (gpm_neg from gpm_neg,
# allowlist_ft_neg from allowlist_ft_neg), as the 5 Oct cabinet and milk runs resumed from the stove
# runs. They inherit the stove namespace, so A's rollouts pair across every run here and with the
# stove pilot's, and B's pair with the historical runs of the same curriculum. Stage 1 trains B with
# the negatives inactive (recipe unchanged). All three B tasks share ONE negatives base: this tests
# generality over B, not replication. The stage-A gate is the stove pilot's (the cabinet-top
# instruction was one of its held-out instructions: plate reached 0/50 under it).
#
# LABELS (point conventions exploratory; every paired CI shown; rollout-paired bootstrap as in the
# stove pilot):
#  CABINET (similar): the stove rule's labels via the same judge (gate from the stove summary):
#   acquisition inconclusive (either arm < 0.50) / clean (both >= 0.80 and gpm - allow >= -0.10) /
#   otherwise _at_acquisition_cost; effect_present (gpm - historical gpm on plate >= +0.20, CI low
#   > 0, against_historical_control); retains (forgetting <= 0.10); projection_contributes (gpm -
#   allow on plate, CI low > 0); allowlist_without_projection_retains. REPORTED beside them, not
#   judged: each arm's cabinet success minus its historical control's (paired), the 2x2 table and
#   the interaction (paired CI).
#  MILK (diverse; a no-harm reading): acquisition inconclusive if either arm < 0.50 (no 0.80 floor:
#   historical GPM 0.76). Two endpoints against historical GPM, paired: plate after milk, and milk.
#   Each endpoint, in this order: no_cost_beyond_10pp (CI low > -0.10); cost_beyond_10pp (CI high <
#   -0.10); observed_drop_over_10pp (point < -0.10); within_10pp_on_observed_rollouts (otherwise).
#   milk_no_harm iff both endpoints are no_cost_beyond_10pp, else not_shown. Also retains,
#   allowlist_without_projection_retains and projection_contributes as for cabinet.
#  ACROSS CURRICULA (reported): stove (quoted from its summary), cabinet and milk; plate before B,
#   plate after B and B for the four arms, and the paired difference of plate before B.
#
# WHAT projection_contributes RESTS ON (summary block projection_basis, per curriculum): the two
# sources' state dicts bitwise equal; every tensor outside the allowlist (projectable_parameters)
# unchanged in both arms from the source's stage0.pt; equal stage-1 trainable_params; the
# allowlist's freeze report listing exactly the allowlist; the two runs' stage-1 train_config equal;
# one namespace (every stream is derive_seed(namespace, ...)). What remains is projection.
#
# HISTORICAL COMPARABILITY: a reasonable basis, not proof. Today's code reproduces the 23-25 Sep
# plain-GPM seq_hetero runs bit for bit at stages 0-1 and rollout for rollout in all 48 of their
# stage-0/1 evaluation cells (docs/runs/2026-11-18_ne70_4task.md); allowlist_ft.py is unchanged
# since 98f143e and gpm.py changed only by the flat-0.99 option (off by default, tested bitwise).
# That does not establish that the October similar_ab paths behaved as today's code would, so
# every comparison with a historical cell carries against_historical_control. The historical
# files are pinned below.
#
# VALIDITY (a failure marks the study invalid), MODE-SPECIFIC: production uses the pins below and
# 50 rows per cell; the smoke uses its own sources' pins (computed at launch, recorded in its
# summary), the first n rows, and the stove smoke's summary; the historical pins hold in both.
#   the stove summary at its pin, valid, gate passed; the historical files at their pins; each
#   resumed run: resume.json naming the pinned source and SHA, no own stage0.pt, eval/stage0.json
#   byte-equal to the source's, clean git_sha, namespace, method config, recipe, negatives inactive
#   at stage 1 with the bank SHA; the B task in config.yaml, result.json and eval/stage1.json; GPM
#   arms: restored memory at its pin and memory_check; allowlist arms: frozen_check against the
#   source with the freeze report; every paired row the same task key, episode index and seed
#   (new and historical runs, and A's rows against the stove pilot's); swap and probe artifacts
#   (checkpoint SHA, weights unchanged).
# STATUS / EXIT: valid 0; invalid 3; incomplete 4.

