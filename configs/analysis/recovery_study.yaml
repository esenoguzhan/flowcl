n_demos_sigma: 50
sigma_fallback: [0.284051, 0.37584, 0.409439, 0.0464323, 0.0716757, 0.099626, 0.97494]   # pooled, 4 tasks x 50 demos
phases: [0.0833333333, 0.25, 0.4166666667, 0.5833333333, 0.75, 0.9166666667]
fallback: {phases: [0.125, 0.375, 0.625, 0.875]}
perturbations: {magnitudes: [1.0, 3.0], n_isotropic_per_magnitude: 2}
