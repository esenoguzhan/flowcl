# The recovery measurement study: the first stage of the "recovery-metric" idea (an exploratory study;
# no training; no Track 2 cells). Committed before any perturbed rollout, together with its simulation
# report (results/recovery_study/validation/). Run by scripts/recovery_study.py; queued by
# scripts/queue_recovery_study.sh. Record: docs/runs/2026-10-1x_recovery_study.md.
#
# QUESTION: is the closed-loop harm of action perturbations concentrated (in phases, action components),
# and is it predictable beyond the perturbation's size?
#
# POLICIES: per task, the seq_ft seed-0 checkpoint just after training on it (stage k for task k, bound
# by SHA-256 below); production evaluation settings (Euler 10, execute_k 8, 600 steps, 128 px, fp32).
# Workers set cudnn.deterministic = True and cudnn.benchmark = False.
# NOMINAL ROLLOUTS: n_nominal per task from the TRAINING-SIDE initial states of demos 0..n_nominal-1 (the
# demo's init_state); the 50 evaluation initial states are never used. Env and policy seed:
# derive_seed(namespace, "recovery::nominal::<task>", i). Recorded at every replan: the step, the
# executed actions, the chunk, the policy generator's state.
# QUERIES (per successful nominal rollout): the replans nearest `phases` x its length; a step already
# taken is dropped (recorded); phase bin = the phase's index. FROZEN FALLBACK (if the smoke projects
# more than budget.max_hours): `fallback.phases`, with M kept.
# PERTURBATIONS of the first execute_k actions of the chunk the policy samples at the query (one bank per
# query, seed derive_seed(namespace, "recovery::bank::<task>", (i * 100 + q))): per structured group
# (position dims 0-2, rotation 3-5, gripper 6) a fixed random unit direction within the group, at
# signs +/- and magnitudes m * sigma (sigma = per-dimension SD of the task's training demos' raw actions,
# all n_demos_sigma demos; a dimension whose SD is exactly 0 in a task uses `sigma_fallback`, the
# per-dimension SD pooled over the four tasks' training demos - AMENDMENT before any production
# continuation, found by the smoke: the Goal drawer task never closes the gripper, SD 0), constant over
# the prefix; plus isotropic directions over the whole prefix at
# the structured perturbations' mean raw norm per magnitude.
# THE INTERVENTION ANALYSED IS THE CONTROLLER-RELEVANT ONE: the change after clipping (size: its norm in
# sigma units over all 7 dims), and the gripper's SIGN FLIPS (the Panda gripper controller uses only
# sign(action)). A CONTROLLER NO-OP (no position/rotation change, no flip) is excluded from Q1 and Q2 and
# is the NEGATIVE CONTROL.
# CONTINUATIONS: M seeds per query, derive_seed(namespace, "recovery::cont::<task>", (i * 100 + q) * 10 + m),
# shared by the nominal continuation and every perturbation (common random numbers). Each: reset ->
# set_init_state -> open-loop replay of the nominal's executed actions up to the query (rebuilding every
# controller state; LIBERO resets with hard_reset, reloading the gripper model) -> the policy samples the
# chunk -> its first execute_k actions are executed, perturbed or not -> closed loop to max_steps.
# DETERMINISM GATE (fail-loud, before any perturbed continuation; gate_rollouts per task): (1) the replay
# to the middle query, continued with the SAVED nominal generator state, reproduces the nominal suffix
# (actions bitwise, success, steps); (2) one query's continuations run in two orders give identical
# outcomes and actions. A failure makes the study INCONCLUSIVE.
# OUTCOMES per perturbed continuation, paired with the nominal continuation (same rollout, query, seed):
# injury (nominal succeeds, perturbed fails), rescue (the reverse); signed excess failure reported.
# Q1 CONCENTRATION: cross-fitted S20 over (rollout x query x structured group) cells: rank cells by their
# injury rate on seeds halves[0], take the top top_fraction's share of the held-out half's EQUALLY
# WEIGHTED cell rates (injuries / at-risk effective trials, at-risk = the nominal continuation
# succeeded), cells with exposure in both halves only; ties at the boundary get fractional shares; swap
# halves and average. Uniform risk gives 0.2 whatever the exposure. A zero held-out total makes Q1
# undefined. Reported separately: temporal S20 (cells = rollout x query) and per-group injury rates.
# Q2 BEYOND MAGNITUDE: ridge (q2.ridge, all but the intercept) logistic models of perturbed failure on
# effective perturbations, leave-one-rollout-out. U: intercept, nominal-continuation failure, a
# restricted cubic spline in log1p(size) (knots: min, 25/50/75%, max of the training fold's positive
# values; linear if not all distinct). R: U + gripper flip categories {1-3, 4-8} + phase x group
# (position, rotation, gripper, isotropic) indicators. Score: the mean per-observation log-loss
# improvement of R over U. NOTE (a change from the plan's wording, before any data): the flips are in R,
# not U. In U they would absorb a gripper-specific (component-only) harm as "magnitude" and recreate the
# false NO-GO that Q1's cells exist to prevent; "magnitude" in U is the component-agnostic size.
# INTERVALS DECIDING GO: the full-procedure cluster bootstrap (bootstrap.n, bootstrap.seed): nominal
# rollouts resampled with replacement; Q1 re-ranked; U and R refitted, every copy of a rollout held out
# together. Level: decision.level (95%; the 99% fallback below).
# USABLE TASK, per regime (`usable`): enough successful nominal rollouts and queries; at least
# min_injuries injuries over at least min_injury_rollouts distinct rollouts.
# OUTCOME (code): GO iff >= 2 usable tasks each pass Q1 (S20 >= q1.min_s20 and its lower bound >
# q1.uniform) AND Q2 (lower bound > 0). NO-GO iff >= 2 usable tasks, fewer than 2 pass, and every failing
# usable task is a clear fail (S20 upper bound < q1.min_s20, or Q2 upper bound <= 0). Otherwise
# INCONCLUSIVE; also INCONCLUSIVE on a failed gate, on no-op mismatches above
# negative_control.max_mismatch_fraction of no-op continuations, or on a no-op injury interval whose lower
# bound exceeds negative_control.max_injury_lower.
# PRE-RUN VALIDATION (results/recovery_study/validation/, committed with this rule): the whole decision
# procedure on synthetic clustered worlds matching the design, both regimes; false GO over
# validation.n_null_worlds per null (uniform risk; nonlinear size dependence with group-dependent size
# distributions and random rollout x query effects), with Clopper-Pearson 95% intervals; power under
# phase-only, component-only (gripper flips) and mixed alternatives; validation.n_boot resamples per
# world (disclosed; production uses bootstrap.n). If a CP upper bound exceeds validation.max_false_go,
# decision.level becomes 0.99 (re-validated); if that fails too, production does not start.
# INTERPRETATIONS (pre-written): GO = "action vulnerability is structured within the tested perturbation
# family"; it authorizes an integrated-action Jacobian and capacity feasibility study (measured
# criticality against uniform sensitivity at matched storage), NOT a method. The method that study could
# lead to is D2's angle B, written explicitly: restricted two-sided protection U^T dW M = 0 with U from
# the measured critical outputs, REPLACING GPM's dW M = 0. NO-GO = "this phase/component estimator, with
# constant 8-step offsets at 1 and 3 sigma, finds harm diffuse or not predictable beyond magnitude at this
# resolution" (it stops this estimator, not the idea). INCONCLUSIVE = "inconclusive at this resolution".
# Scope: one seed's policies, simulation only; nothing transfers to AgileX without its own validation.

