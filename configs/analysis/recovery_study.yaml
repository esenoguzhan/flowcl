  fallback: {min_rollouts: 9, min_queries: 36, min_injuries: 10, min_injury_rollouts: 3}
negative_control: {max_mismatch_fraction: 0.01, max_injury_lower: 0.02}
decision: {level: 0.95}
validation: {n_null_worlds: 200, n_power_worlds: 100, n_boot: 200, max_false_go: 0.10, seed: 20261017,
             base_logit: -2.5, p_success: 0.85, effect: 2.0}
budget: {max_hours: 10}
out: recovery_study                # under the results root
work: recovery_study/.work
