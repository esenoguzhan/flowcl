# Pre-registered outcome rule for the adaptive-GPM runs (gpm_projected_adam_ne90): the
# causal test after the forgetting diagnostics (docs/runs/2026-09-24_gpm_forgetting_
# diagnostics.md §8). Seed 0 was committed before its run (9701620); seed 1 and the
# replication rule were added on 25 Sep 2026, before any seed-1 method result existed;
# seed 2 on 25 Sep 2026, before seq_ft seed 2 ran.
# Evaluated by scripts/adaptive_report.py (--seed N; --replication 0 1).
#
# All thresholds are inclusive, except the CI lower bound, which must be strictly > 0, and
# the premise, which requires the baseline to be strictly below its threshold.
#
# Verdict, step 1 (gates, in order):
#   identity fails                           -> invalid comparison (stop)
#   per-layer energy check fails, (a) or (b) -> invalid implementation (stop)
#   baseline R[2][Object] >= Object threshold -> not applicable: the baseline did not forget
#                                               (added for replication; holds for seed 0)
#   interference ratio > max_ratio in either half -> manipulation weak; steps 2-3 are
#                                               computed and labelled exploratory
# Step 2 (T3 plasticity x transition retention gain):
#   pass, no  -> under-protection hypothesis not supported
#   fail, yes -> stability-plasticity trade-off
#   fail, no  -> plasticity failure with no retention benefit; causal test inconclusive
#   pass, yes -> transition support -> step 3
# Step 3: durable Object retention and T4 plasticity both met -> strong / durable support;
#   otherwise transition support, flagged with the failed durable condition.

# Identity: stage-0/1 state dicts and the T1 memory equal the baseline's (p = 0 at T1).
identity_stages: [0, 1]

# Implementation check, every layer and every memory extension after T2, T3, T4 with
# 1 - p > applicability_atol:
#   (a) captured >= target - tol, target recomputed as min(1, max(eps, p + f (1 - p)))
#       and equal to the recorded target_fraction (to target_match_atol);
#   (b) captured >= p + f (1 - p) - tol   (new-energy share >= f).
energy:
  eps: 0.95
  new_energy_fraction: 0.90
  tasks: [1, 2, 3]
  tol: 1.0e-6
  applicability_atol: 1.0e-12
  target_match_atol: 1.0e-12

# Manipulation strength: variant / baseline median direct r of the target task (Object)
# under the update that trains the next task (Goal), from the diagnostics' primary
# comparison, in each half. The diagnostics predicted ~0.45 (sqrt(0.01 / 0.05)).
interference:
  comparison: primary
  max_ratio: 0.70

# Rollout cells [stage, task]. Each check's threshold is the seed's per-task threshold at
# that task. Thresholds are NOT restated here: sequence_report.yaml is the single source,
# and this report consumes the threshold blocks written into both runs' sequence reports,
# asserting they agree (reference id and result.json hash, thresholds, margin, episode
# namespace, task order across both blocks and all three result.json files).
premise:
  baseline_cell: [2, 1]          # the baseline must have forgotten Object across Goal
retention:
  transition_cell: [2, 1]        # Object after Goal (the transition the variant targets)
  min_improvement: 0.20          # paired variant - baseline, same episode seeds; CI low > 0
  durable_cell: [3, 1]           # Object at the final stage
plasticity:
  t3_cell: [2, 2]
  t4_cell: [3, 3]
secondary:                       # reported, not decisive
  goal_cell: [3, 2]

# Per seed: runs (under results/), their sequence reports (threshold source) and
# diagnostics reports, and the output.
seeds:
  0:
    variant_run: seq_hetero__gpm_projected_adam_ne90__seed0
    baseline_run: seq_hetero__gpm_projected_adam__seed0
    reference_run: seq_hetero__seq_ft__seed0
    sequence_reports:
      variant: gpm_seq_ne90/report.json
      baseline: gpm_seq/report.json
    diagnostics:
      variant: forgetting_diag_ne90/report.json
      baseline: forgetting_diag/report.json
    out: adaptive_gpm/report.json
  1:
    variant_run: seq_hetero__gpm_projected_adam_ne90__seed1
    baseline_run: seq_hetero__gpm_projected_adam__seed1
    reference_run: seq_hetero__seq_ft__seed1
    sequence_reports:
      variant: gpm_seq_ne90_seed1/report.json
      baseline: gpm_seq_seed1/report.json
    diagnostics:
      variant: forgetting_diag_ne90_seed1/report.json
      baseline: forgetting_diag_seed1/report.json
    out: adaptive_gpm_seed1/report.json
  2:
    variant_run: seq_hetero__gpm_projected_adam_ne90__seed2
    baseline_run: seq_hetero__gpm_projected_adam__seed2
    reference_run: seq_hetero__seq_ft__seed2
    sequence_reports:
      variant: gpm_seq_ne90_seed2/report.json
      baseline: gpm_seq_seed2/report.json
    diagnostics:
      variant: forgetting_diag_ne90_seed2/report.json
      baseline: forgetting_diag_seed2/report.json
    out: adaptive_gpm_seed2/report.json

# Replication across seeds (symmetric; every seed's verdict is inspected), rows in order:
#   any invalid_comparison / invalid_implementation          -> inconclusive (invalid run)
#   any not_applicable_baseline_retained                     -> not applicable
#   any manipulation_weak (exploratory), trade_off, inconclusive -> inconclusive
#   all transition_support / durable_support                 -> replicated
#                                   (durably replicated if all durable_support)
#   all not_supported                                        -> consistently not supported
#   a mix of support and not_supported                       -> not replicated
replication:
  out: adaptive_gpm/replication.json
