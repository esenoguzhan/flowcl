# The wine pair's negative bank (A = put the wine bottle on top of the cabinet), built by the plate bank's
# recipe (configs/analysis/instruction_negatives_bank.yaml): noun-slot swaps of A's instruction, then
# unrelated real tasks. The words of the two held-out panel instructions that differ from A ("rack": B,
# "put the wine bottle on the rack"; "bowl": "put the bowl on top of the cabinet") never occur here;
# "wine bottle" and "cabinet" recur by design. Committed with the rule, before any run.
forbidden_words: [rack, bowl]
noun_swaps:
  - put the wine bottle on the plate
  - put the wine bottle on the stove
  - put the wine bottle on the floor
  - put the wine bottle on the cream cheese
  - put the wine bottle on the ketchup
  - put the cream cheese on top of the cabinet
  - put the ketchup on top of the cabinet
  - put the plate on top of the cabinet
unrelated:
  - push the plate to the front of the stove
  - open the middle drawer of the cabinet
  - pick up the alphabet soup and place it in the basket
  - pick up the ketchup and place it in the basket
  - pick up the milk and place it in the basket
  - put the yellow and white mug in the microwave and close it
  - pick up the book and place it in the back compartment of the caddy
